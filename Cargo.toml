[package]
name = "rustapi"
version = "0.1.0"
authors = ["ndelvalle <nicolas.delvalle@gmail.com>"]
edition = "2021"

[dependencies]
config = "0.15.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "macros",
  "migrate",
  "uuid",
  "chrono",
] }
uuid = { version = "1.29.3", features = ["v7", "serde"] }
thiserror = "2.0.21"
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tower-http = { version = "0.7.1", features = [
  "trace",
  "compression-br",
  "request-id",
  "timeout",
  "limit",
  "sensitive-headers",
  "cors",
] }
chrono = { version = "0.4.45", features = ["serde"] }
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
argon2 = "0.6.0"
validator = { version = "0.21.0", features = ["derive"] }
mime = "0.3.18"
bytes = "1.12.2"
axum-extra = { version = "0.12.6", features = ["typed-header"] }

[dev-dependencies]
assert-json-diff = "2.0.2"
reqwest = { version = "0.13.5", features = ["json"] }
pretty_assertions = "1.4.1"
base64 = "0.22"

# Password hashing is deliberately expensive and far slower without optimizations, so these
# are optimized in debug builds to keep development and tests fast.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
