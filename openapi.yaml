openapi: 3.1.0

info:
  version: 1.0.0
  title: v1 REST API
  description: v1 REST API

servers:
- url: https://api.yoururl.com

externalDocs:
  description: v1 REST API
  url: https://github.com/ndelvalle/rustapi

paths:
  "/status":
    get:
      summary: Get the API status
      description: Reports whether the API is up and can reach the database
      operationId: application/get-status
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
        '503':
          description: The database is unreachable
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string

  "/users":
    post:
      summary: Create a new user
      description: Create a new user
      operationId: application/create-user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  minLength: 1
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        '201':
          description: Response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '409':
          description: The email is already in use
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FieldsError"
        '422':
          $ref: '#/components/responses/ValidationFailed'

  "/users/authenticate":
    post:
      summary: Authenticate a user
      description: Exchange an email and a password for an access token
      operationId: application/authenticate-user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - user
                properties:
                  access_token:
                    type: string
                  user:
                    "$ref": "#/components/schemas/User"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '423':
          $ref: '#/components/responses/Locked'

  "/v1/cats":
    # Query cats
    get:
      summary: Query cats
      description: Query the cats of the authenticated user, newest first
      operationId: application/query-cats
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: The maximum number of cats to return
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 100
        - name: offset
          in: query
          description: The number of cats to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Response
          headers:
            X-Pagination-Count:
              description: The total number of cats
              schema:
                type: integer
            X-Pagination-Offset:
              schema:
                type: integer
            X-Pagination-Limit:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Cat"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'

    # Create a new cat
    post:
      summary: Create a new cat
      description: Create a new cat
      operationId: application/create-cat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CatInput"
      responses:
        '201':
          description: Response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Cat"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  "/v1/cats/{cat_id}":
    parameters:
      - name: cat_id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    # Get cat by ID
    get:
      summary: Get cat by ID
      description: get cat by ID
      operationId: application/get-cat-by-id
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Cat"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
        '404':
          $ref: '#/components/responses/NotFound'

    # Remove cat by ID
    delete:
      summary: Remove a cat by ID
      description: Removes a cat by ID
      operationId: application/remove-cat-by-id
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
        '404':
          $ref: '#/components/responses/NotFound'

    # Update cat by ID
    put:
      summary: Update a cat by ID
      description: Update cat by ID
      operationId: application/update-cat-by-id
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CatInput"
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Cat"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

components:
  schemas:
    # Cat schema
    Cat:
      type: object
      required:
        - id
        - user
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        user:
          type: string
          format: uuid
          description: The ID of the user that owns the cat
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CatInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          description: The cat name

    # User schema
    User:
      type: object
      required:
        - id
        - name
        - email
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string

    FieldsError:
      type: object
      required:
        - code
        - message
        - errors
      properties:
        code:
          type: integer
        message:
          type: string
        errors:
          type: object
          description: Maps each rejected field to the reasons why it was rejected
          additionalProperties:
            type: array
            items:
              type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Unauthorized:
      description: Authentication information is missing or invalid
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Locked:
      description: The user is locked
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    ValidationFailed:
      description: The request body has invalid fields
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/FieldsError"
